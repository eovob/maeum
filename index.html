<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<title>마음결 · 오늘의 한 구절</title>
<meta name="description" content="오늘의 기분과 상황에 맞는 불교 경전의 한 구절을 만나보세요.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- 홈 화면 -->
  <section class="screen screen--home" id="screen-home">
    <header class="header">
      <div class="wordmark">
        <span class="wordmark__glyph">◯</span>
        <div class="wordmark__text">
          <h1>마음결</h1>
          <p>오늘, 마음에 닿는 한 구절</p>
        </div>
      </div>
      <button class="icon-btn" id="btn-library" aria-label="저장한 구절 보기">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <p class="prompt">지금, 어떤 마음이신가요?</p>

    <div class="mood-grid" id="mood-grid" role="list"></div>

    <button class="cta" id="btn-draw" disabled>
      <span class="cta__label">구절 받기</span>
    </button>

    <p class="hint">마음을 하나 골라주세요</p>
  </section>

  <!-- 구절 화면 -->
  <section class="screen screen--reveal" id="screen-reveal" hidden>
    <button class="icon-btn icon-btn--back" id="btn-back" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="enso-wrap" id="enso-wrap">
      <svg class="enso" id="enso-svg" viewBox="0 0 200 200">
        <path id="enso-path" d="M 100 24
          A 76 76 0 1 1 40 60"
          fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="quote-card" id="quote-card">
      <p class="quote-mood-tag" id="quote-mood-tag"></p>
      <p class="quote-text" id="quote-text"></p>
      <p class="quote-source" id="quote-source"></p>

      <div class="divider"></div>

      <p class="reflect-label">생각해보기</p>
      <p class="reflect-text" id="reflect-text"></p>

      <textarea class="journal-input" id="journal-input" placeholder="오늘 이 구절에 대한 내 생각을 적어보세요 (선택)" rows="3"></textarea>

      <div class="action-row">
        <button class="chip-btn" id="btn-save">
          <svg viewBox="0 0 24 24" width="18" height="18"><path id="heart-path" d="M12 20s-7-4.35-9.5-8.5C.6 8.1 2.3 4.5 6 4.5c2 0 3.4 1.1 4 2.3.6-1.2 2-2.3 4-2.3 3.7 0 5.4 3.6 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span id="save-label">서재에 저장</span>
        </button>
        <button class="chip-btn" id="btn-again">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 1 1 2.3 5.6M4 12V6m0 6h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>다른 구절</span>
        </button>
      </div>
    </div>
  </section>

  <!-- 서재 화면 -->
  <section class="screen screen--library" id="screen-library" hidden>
    <header class="header header--sub">
      <button class="icon-btn" id="btn-library-back" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>나의 서재</h2>
      <span class="header-spacer"></span>
    </header>
    <div class="library-list" id="library-list"></div>
    <div class="empty-state" id="library-empty" hidden>
      <p>아직 저장한 구절이 없어요.</p>
      <p class="empty-state__sub">마음에 닿는 구절을 만나면 하트를 눌러보세요.</p>
    </div>
  </section>

  <!-- 하단 준비중 네비게이션 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab tab--active" id="tab-home">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>오늘</span>
    </button>
    <button class="tab" id="tab-library-nav">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>서재</span>
    </button>
    <button class="tab tab--soon" data-soon="백과사전">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>백과사전</span>
    </button>
    <button class="tab tab--soon" data-soon="커뮤니티">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M15.5 12.5c2.6.3 4.5 2.3 4.5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>커뮤니티</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
